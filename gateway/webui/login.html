<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1a22"><title>HCH5 Control · Login</title><link rel="stylesheet" href="/assets/auth.css"><script defer src="/assets/auth.js"></script></head><body><main class="login-shell"><section class="login-card"><div class="login-brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M12 31 32 13l20 18v20H39V38H25v13H12Z"/><path class="wave" d="M10 44c9-7 16-7 25 0 8 6 13 6 20 0"/></svg></span><div><small>HCH5 CONTROL</small><b>Smart ventilation</b></div></div><h1 id="auth-title">Login</h1><p id="auth-intro">Log ind på den lokale styring af dit ventilationsanlæg.</p><form id="auth-form"><label>Brugernavn<input id="username" autocomplete="username" required minlength="3"></label><label>Adgangskode<input id="password" type="password" autocomplete="current-password" required minlength="10"></label><label id="confirm-row" hidden>Gentag adgangskode<input id="confirm" type="password" autocomplete="new-password" minlength="10"></label><label class="remember-login"><input id="remember" type="checkbox"><span>Husk mig i 30 dage</span></label><button type="submit" id="submit">Log ind</button><p id="message" role="alert"></p></form><p class="local">Lokal adgang · HCH5 Control sender ikke dine loginoplysninger til en cloudtjeneste. “Husk mig” bruger en lokal session på Raspberry Pi.</p></section></main></body></html>
