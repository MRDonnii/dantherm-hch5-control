<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dantherm login</title><link rel="stylesheet" href="/assets/auth.css"><script defer src="/assets/auth.js"></script></head><body><main class="login-shell"><section class="login-card"><div class="logo">D</div><small>DANTHERM HCH5</small><h1 id="auth-title">Login</h1><p id="auth-intro">Log ind for at åbne dit lokale ventilationsanlæg.</p><form id="auth-form"><label>Brugernavn<input id="username" autocomplete="username" required minlength="3"></label><label>Adgangskode<input id="password" type="password" autocomplete="current-password" required minlength="10"></label><label id="confirm-row" hidden>Gentag adgangskode<input id="confirm" type="password" autocomplete="new-password" minlength="10"></label><label class="remember-login"><input id="remember" type="checkbox"><span>Husk mig i 30 dage</span></label><button type="submit" id="submit">Log ind</button><p id="message" role="alert"></p></form><p class="local">Lokal adgang · Adgangskoden gemmes ikke i browseren; “Husk mig” bruger en lokal 30-dages session på Raspberry Pi.</p></section></main></body></html>
