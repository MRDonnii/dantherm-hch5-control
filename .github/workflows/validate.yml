name: Validate
on:
  push:
    branches: [main, "beta/**", "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest pyserial==3.5 paho-mqtt PyYAML
      - run: bash -n install.sh install-hch5-control.sh update.sh uninstall.sh
      - run: python -m py_compile gateway/*.py
      - run: pytest -q
      - run: node --check gateway/webui/dashboard.js
      - run: node --check gateway/webui/auth.js
      - run: node --check gateway/webui/controller.js
      - run: node --check gateway/webui/master_status.js
      - run: node --check gateway/webui/smartcontrol.js
      - run: node --check gateway/webui/modern-controls.js
      - run: node --check gateway/webui/prepaint.js
      - run: node --check gateway/webui/sniffer.js
      - name: Install WebUI v2 dependencies
        run: npm install --prefix frontend-v2 --no-audit --no-fund
      - name: Type-check WebUI v2
        run: npm run --prefix frontend-v2 typecheck
      - name: Remove previous generated WebUI v2 assets
        run: rm -f gateway/webui/v2-*.js gateway/webui/v2-*.css
      - name: Build WebUI v2
        run: npm run --prefix frontend-v2 build
      - name: Validate deployable WebUI v2 bundle
        run: |
          test -s gateway/webui/index.html
          grep -q '/assets/v2-' gateway/webui/index.html
          compgen -G 'gateway/webui/v2-*.js' >/dev/null
          compgen -G 'gateway/webui/v2-*.css' >/dev/null
          for js in gateway/webui/v2-*.js; do node --check "$js"; done
      - name: Commit validated WebUI v2 bundle
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/work/webui-rebuild-v2' ||
           github.ref == 'refs/heads/work/overview-v2' ||
           startsWith(github.ref, 'refs/heads/beta/'))
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A gateway/webui/index.html gateway/webui/v2-*.js gateway/webui/v2-*.css
          if ! git diff --cached --quiet; then
            git commit -m 'Build WebUI v2 bundle [skip ci]'
            git push
          fi
