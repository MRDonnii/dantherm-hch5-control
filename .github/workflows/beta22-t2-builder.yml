name: Beta22 T2 Builder
on:
  push:
    branches: ["work/full-ui-beta22"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply canonical T2 hotfix
        run: python tools/apply_beta22_t2_hotfix.py
      - name: Validate Python
        run: |
          pip install pytest pyserial==3.5 paho-mqtt PyYAML
          python -m py_compile gateway/*.py
          pytest -q
      - name: Validate frontend
        run: |
          npm install --prefix frontend-v2 --no-audit --no-fund
          npm run --prefix frontend-v2 typecheck
          npm run --prefix frontend-v2 test -- --run
          rm -f gateway/webui/v2-*.js gateway/webui/v2-*.css
          npm run --prefix frontend-v2 build
          test -s gateway/webui/index.html
          for js in gateway/webui/v2-*.js; do node --check "$js"; done
      - name: Commit validated hotfix
        run: |
          rm -f tools/apply_beta22_t2_hotfix.py .github/workflows/beta22-t2-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix live T2 mapping in 1.2.0-beta.22'
          git push
