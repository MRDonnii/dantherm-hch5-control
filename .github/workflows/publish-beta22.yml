name: Publish Beta 22

on:
  push:
    branches: ["work/full-ui-beta22"]
    paths:
      - ".github/workflows/publish-beta22.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-ui-beta22

      - name: Publish immutable beta.22 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0-beta.22
          TARGET: 6b2ba8f4aa49eab772a0d47bbd7bef533ccc528e
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          Beta release

          - Adds deterministic night-mode arbitration so air-quality demand can lift night ventilation only to the configured night ceiling.
          - Adds bathroom-specific humidity setpoint, hysteresis and maximum ventilation level to avoid repeated full-boost conflicts.
          - Fixes canonical live T2 mapping in passive and active gateway paths and refreshes T2 from the verified HAC1 temperature snapshot.
          - Keeps legacy temperature keys alongside canonical keys for compatibility.
          - Includes Python, controller/runtime, frontend and T2 regression validation.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "HCH5 Control 1.2.0-beta.22" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      - name: Remove one-shot publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-beta22.yml
          git commit -m 'Remove one-shot beta.22 publisher'
          git push