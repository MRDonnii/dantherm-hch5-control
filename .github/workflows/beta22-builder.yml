name: Beta22 Builder
on:
  push:
    branches: ["work/full-ui-beta22"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply beta.22 migration
        run: |
          python tools/apply_beta22.py
          python tools/apply_beta22_test_updates.py
      - name: Python dependencies
        run: pip install pytest pyserial==3.5 paho-mqtt PyYAML
      - name: Python validation
        run: |
          python -m py_compile gateway/*.py
          pytest -q
      - name: Frontend dependencies
        run: npm install --prefix frontend-v2 --no-audit --no-fund
      - name: Frontend tests and build
        run: |
          npm run --prefix frontend-v2 typecheck
          npm run --prefix frontend-v2 test -- --run
          rm -f gateway/webui/v2-*.js gateway/webui/v2-*.css
          npm run --prefix frontend-v2 build
          test -s gateway/webui/index.html
          grep -q '/assets/v2-' gateway/webui/index.html
          compgen -G 'gateway/webui/v2-*.js' >/dev/null
          compgen -G 'gateway/webui/v2-*.css' >/dev/null
          for js in gateway/webui/v2-*.js; do node --check "$js"; done
      - name: Commit beta.22 source and bundle
        run: |
          rm -f tools/apply_beta22.py tools/apply_beta22_test_updates.py .github/workflows/beta22-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build HCH5 Control 1.2.0-beta.22'
          git push
